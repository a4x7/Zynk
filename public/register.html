<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up - Zynk</title>
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <header>
        <nav id="navbar">
            <span id="nav-span-first">
                <a href="index.html" id="nav-heading"><strong>Zynk</strong></a>
            </span>
            <span id="nav-span-last">
                <span id="nav-auth-placeholder-1"></span>
                <span id="nav-auth-placeholder-2"></span>
            </span>
        </nav>
    </header>

    <main>
        <span id="heading">
            <span></span>
            Create your account
            <button id="heading-theme">󰔎</button>
        </span>
        <form id="registerForm">
            <label for="usrname">Username*:</label>
            <input type="text" id="usrname" name="username"><br>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email"><br>
            <label for="avatar">Avatar:</label>
            <input type="file" id="avatar" name="avatar"><br>
            <label for="pass">Password*:</label>
            <input type="text" id="pass" name="password"><br>
            <button type="submit">Sign up</button>
        </form>
    </main>
    <footer>
        Zynk — built by Arnav. <a href="https://github.com/a4x7/Zynk" target="_blank">GitHub</a>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
